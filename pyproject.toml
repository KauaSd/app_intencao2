[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-engine"
version = "0.1.0"
description = "Motor determinístico de detecção de intenção baseado em regras (PT-BR/EN)"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.8,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pt = ["pt-core-news-sm>=3.8,<3.9"]
en = ["en-core-web-sm>=3.8,<3.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
intent = "intent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intent = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
